name: One-shot attractor diagnosis-control archive refresh

on:
  push:
    branches:
      - task/mission-control-direct-pm-attractor-independence-20260901
    paths:
      - .github/workflows/attractor-diagnosis-control-one-shot.yml

permissions:
  contents: read

concurrency:
  group: attractor-diagnosis-control-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-refresh:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/mission-control-direct-pm-attractor-independence-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh deterministic Mission Control source archive
        run: bash tools/codex-mission-control/package-source.sh

      - name: Install locked Mission Control dependencies
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm ci --ignore-scripts

      - name: Run Mission Control tests
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm test

      - name: Check Mission Control TypeScript
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run typecheck

      - name: Build Mission Control production bundle
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run build

      - name: Run repository tests and audit
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_codex_github.py --root . --fail-on error

      - name: Commit refreshed source archive
        env:
          TARGET_BRANCH: task/mission-control-direct-pm-attractor-independence-20260901
        run: |
          git config user.name "mission-control-one-shot"
          git config user.email "mission-control-one-shot@users.noreply.github.com"
          git add tools/codex-mission-control/source-archive tools/codex-mission-control/SOURCE-ARCHIVE.sha256
          if git diff --cached --quiet; then
            echo "Source archive was already current" >&2
            exit 1
          fi
          git commit -m "build(mission-control): refresh diagnosis-control source archive"
          git push origin "HEAD:${TARGET_BRANCH}"
