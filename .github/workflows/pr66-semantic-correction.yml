name: PR66 semantic blocker correction

on:
  push:
    branches:
      - task/issue-53-owner-response-continuation-20260906

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: contains(github.event.head_commit.message, '[pr66-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply narrowly reviewed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def splice(text: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker missing")
              end_start = text.find(end_marker, start)
              if end_start < 0:
                  raise SystemExit(f"{label}: end marker missing")
              end = end_start + len(end_marker)
              if text.find(start_marker, start + 1) >= 0:
                  raise SystemExit(f"{label}: start marker ambiguous")
              return text[:start] + replacement + text[end:]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          owner_path = Path('tools/codex-mission-control/restored/codex-mission-control/lib/owner-response-continuation.ts')
          text = owner_path.read_text()
          start_marker = '  const route = decisionRouteStates(related).find((state) => state.decisionRequestId === intent.resumeDecisionRequestId);'
          end_marker = '  const owner = direct ? delivery : route.projectManagerResponse;'
          replacement = '''  const request = origins[0] as ReasoningMessageStoredEvent;
          const laterOwnerMessages = related.filter((event): event is ReasoningMessageStoredEvent => event.data.type === "reasoning_message_recorded"
            && event.data.author_role === "OWNER" && event.sequence > request.sequence);
          const directReplies = laterOwnerMessages.filter((event) => event.data.surface_role === "SUPERVISOR"
            && event.data.parent_message_id === request.data.message_id);
          const projectManagerReplies = laterOwnerMessages.filter((event) => event.data.surface_role === "PROJECT_MANAGER"
            && event.data.parent_message_id === request.data.message_id);
          if (directReplies.length > 1 || projectManagerReplies.length > 1 || (directReplies.length > 0 && projectManagerReplies.length > 0)) {
            throw new Error("Continuation OWNER response causality is ambiguous.");
          }
          let direct = false;
          let owner: ReasoningMessageStoredEvent | null = null;
          let delivery: ReasoningMessageStoredEvent | null = null;
          if (directReplies.length === 1) {
            direct = true;
            owner = directReplies[0]!;
            delivery = owner;
          } else if (projectManagerReplies.length === 1) {
            const projectManagerOwner = projectManagerReplies[0]!;
            owner = projectManagerOwner;
            const exactForwards = laterOwnerMessages.filter((event) => event.data.surface_role === "SUPERVISOR"
              && event.data.parent_message_id === projectManagerOwner.data.message_id
              && event.data.body_sha256 === projectManagerOwner.data.body_sha256);
            const alteredForwards = laterOwnerMessages.filter((event) => event.data.surface_role === "SUPERVISOR"
              && event.data.parent_message_id === projectManagerOwner.data.message_id
              && event.data.body_sha256 !== projectManagerOwner.data.body_sha256);
            if (exactForwards.length !== 1 || alteredForwards.length > 0) {
              throw new Error("Continuation OWNER response causality is ambiguous or invalid.");
            }
            delivery = exactForwards[0]!;
          }
          const route = decisionRouteStates(related).find((state) => state.decisionRequestId === intent.resumeDecisionRequestId);
          if (!owner || !delivery || !route || route.status !== "SUPERVISOR_RESOLUTION_REQUIRED"
            || route.supervisorResponse?.data.message_id !== delivery.data.message_id) {
            throw new Error("Continuation requires an OWNER response with SUPERVISOR_RESOLUTION_REQUIRED routing.");
          }
          if (request.data.stable_supervisor_id !== intent.supervisorId || delivery.data.stable_supervisor_id !== intent.supervisorId) {
            throw new Error("Continuation requires exact stable supervisor identity on request and OWNER delivery.");
          }'''
          owner_path.write_text(splice(text, start_marker, end_marker, replacement, 'owner causal cardinality'))

          receipts_path = Path('tools/codex-mission-control/restored/codex-mission-control/lib/github-decision-receipts.ts')
          text = receipts_path.read_text()
          anchor = '    const envelope = buildGitHubDecisionReceiptEnvelope(events, candidate, policy, ingestedAt);'
          insertion = '''    const exactDuplicate = events.some((event) => event.data.type === "github_decision_receipt_ingested"
            && event.data.github_receipt.repository.toLowerCase() === candidate.repository.toLowerCase()
            && event.data.github_receipt.issue_number === candidate.issueNumber
            && event.data.github_receipt.comment_id === candidate.commentId
            && event.data.github_receipt.immutable_url === candidate.immutableUrl);
          if (exactDuplicate) return [];
          '''
          text = replace_once(text, anchor, insertion + anchor, 'exact GitHub candidate idempotency')
          text = replace_once(text, '          immutable_provider_locator: candidate.immutableUrl,', '          immutable_provider_locator: null,', 'GitHub artifact provider locator')
          receipts_path.write_text(text)

          owner_test_path = Path('tools/codex-mission-control/restored/codex-mission-control/tests/owner-response-continuation.test.ts')
          text = owner_test_path.read_text()
          marker = 'test("current owner outcome uses the latest authoritative worker event and rejects every stale component", () => {'
          if text.count(marker) != 1:
              raise SystemExit('owner ambiguity test insertion marker missing or ambiguous')
          test_block = '''test("continuation fails closed on every ambiguous direct/PM OWNER causal cardinality", () => {
            const multipleDirect = fixture();
            multipleDirect.events.push(reasoning(6, "OWNER", "SUPERVISOR", "Second direct OWNER response.", { parent_message_id: multipleDirect.request.data.message_id }));
            assert.throws(() => deriveOwnerResponseContinuation(multipleDirect.events, multipleDirect.intent), /causality is ambiguous/);

            const directAndPm = fixture("PROJECT_MANAGER");
            directAndPm.events.push(reasoning(6, "OWNER", "SUPERVISOR", "Competing direct OWNER response.", { parent_message_id: directAndPm.request.data.message_id }));
            assert.throws(() => deriveOwnerResponseContinuation(directAndPm.events, directAndPm.intent), /causality is ambiguous/);

            const multiplePm = fixture("PROJECT_MANAGER");
            multiplePm.events.push(reasoning(6, "OWNER", "PROJECT_MANAGER", "Second PM OWNER response.", { parent_message_id: multiplePm.request.data.message_id }));
            assert.throws(() => deriveOwnerResponseContinuation(multiplePm.events, multiplePm.intent), /causality is ambiguous/);

            const multipleForwards = fixture("PROJECT_MANAGER");
            multipleForwards.events.push(reasoning(6, "OWNER", "SUPERVISOR", exactOwnerText, { parent_message_id: multipleForwards.owner.data.message_id }));
            assert.throws(() => deriveOwnerResponseContinuation(multipleForwards.events, multipleForwards.intent), /causality is ambiguous or invalid/);
          });

          '''
          owner_test_path.write_text(text.replace(marker, test_block + marker, 1))

          receipt_test_path = Path('tools/codex-mission-control/restored/codex-mission-control/tests/github-decision-receipts.test.ts')
          text = receipt_test_path.read_text()
          text = replace_once(text,
              '      assert.equal(resolution.data.acquisition_method, "GITHUB_SESSION_ATTESTED");\n      assert.equal(resolution.producerKind, "SUPERVISOR");',
              '      assert.equal(resolution.data.acquisition_method, "GITHUB_SESSION_ATTESTED");\n      assert.equal(resolution.data.immutable_provider_locator, null);\n      assert.equal(resolution.producerKind, "SUPERVISOR");',
              'resolution locator assertion')
          old_line = '      assert.throws(() => ingestGitHubSupervisionCandidate(store, fixture.candidate, policy(), continuationIngestedAt), /pending/);'
          new_lines = '''      assert.deepEqual(ingestGitHubSupervisionCandidate(store, fixture.candidate, policy(), continuationIngestedAt), []);
          const replayCommentId = fixture.candidate.commentId + 1000;
          const replayCandidate = { ...fixture.candidate, commentId: replayCommentId,
            immutableUrl: fixture.candidate.immutableUrl.replace(/issuecomment-\\d+$/, `issuecomment-${replayCommentId}`) };
          assert.throws(() => ingestGitHubSupervisionCandidate(store, replayCandidate, policy(), continuationIngestedAt), /pending|already been consumed/);'''
          receipt_test_path.write_text(replace_once(text, old_line, new_lines, 'duplicate/replay regression'))

          Path('.github/workflows/pr66-semantic-correction.yml').unlink()
          PY

      - name: Focused Mission Control continuation regressions
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: |
          npm ci --ignore-scripts
          npx tsx --test tests/owner-response-continuation.test.ts tests/github-decision-receipts.test.ts

      - name: Full Mission Control checkpoint
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Relay checkpoint
        working-directory: tools/codex-mission-control/vps-browser-relay
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          bash -n scripts/install-user-service.sh
          bash -n scripts/launch-browser.sh
          test -s systemd/user/mission-control-chatgpt.slice
          test -s systemd/user/mission-control-chatgpt-browser.service
          test -s systemd/user/mission-control-chatgpt-relay.service

      - name: Repository deterministic checkpoint
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_codex_github.py --root . --fail-on error
          git diff --check

      - name: Commit exact tested correction tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && { echo 'No correction diff produced'; exit 1; } || true
          git commit -m "Fix PR #66 semantic release blockers"
          git push origin HEAD:task/issue-53-owner-response-continuation-20260906
