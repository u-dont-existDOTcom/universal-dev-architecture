name: Universal repository compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: universal-repository-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-compliance:
    name: Deterministic repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit repository baseline
        run: python3 scripts/audit_codex_github.py --root . --fail-on error
