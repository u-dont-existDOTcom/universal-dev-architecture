name: Universal repository compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: universal-repository-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-compliance:
    name: Deterministic repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit repository baseline
        run: python3 scripts/audit_codex_github.py --root . --fail-on error
