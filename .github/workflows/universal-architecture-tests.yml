name: Universal repository compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: universal-repository-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-compliance:
    name: Deterministic repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit repository baseline
        run: python3 scripts/audit_codex_github.py --root . --fail-on error

  mission-control-application:
    name: Mission Control app · tests, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/codex-mission-control/restored/codex-mission-control
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm compatible runner Node.js
        run: node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) throw new Error(`Node.js 20+ required, got ${process.version}`); console.log(process.version)'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run Mission Control application tests
        run: npm test

      - name: Check Mission Control TypeScript
        run: npm run typecheck

      - name: Build Mission Control production bundle
        run: npm run build

  vps-browser-relay:
    name: VPS browser relay · tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/codex-mission-control/vps-browser-relay
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm test-runner Node.js
        run: node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) throw new Error(`Node.js 20+ required for tests, got ${process.version}`); console.log(process.version)'

      - name: Install locked relay package
        run: npm ci --ignore-scripts

      - name: Run relay tests
        run: npm test

      - name: Check relay JavaScript syntax
        run: npm run check

      - name: Check relay shell and service assets
        run: |
          bash -n scripts/install-user-service.sh
          bash -n scripts/launch-browser.sh
          test -s systemd/user/mission-control-chatgpt.slice
          test -s systemd/user/mission-control-chatgpt-browser.service
          test -s systemd/user/mission-control-chatgpt-relay.service
