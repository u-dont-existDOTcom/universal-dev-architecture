name: Mission Control Chat-Work hotfix archive refresh

on:
  workflow_dispatch:
  push:
    branches:
      - task/mission-control-direct-pm-attractor-independence-20260901
    paths:
      - .github/workflows/mission-control-chat-work-hotfix-one-shot.yml
      - scripts/apply_chat_work_authority_ledger_hotfix.py
      - tools/codex-mission-control/package-source.sh
      - tools/codex-mission-control/restored/codex-mission-control/**

permissions:
  contents: read

concurrency:
  group: mission-control-chat-work-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-refresh:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/mission-control-direct-pm-attractor-independence-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Chat-to-Work ledger authority hotfix
        run: python3 scripts/apply_chat_work_authority_ledger_hotfix.py

      - name: Refresh deterministic Mission Control source archive
        run: bash tools/codex-mission-control/package-source.sh

      - name: Install locked Mission Control dependencies
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm ci --ignore-scripts

      - name: Run Mission Control tests
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm test

      - name: Check Mission Control TypeScript
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run typecheck

      - name: Build Mission Control production bundle
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run build

      - name: Run repository tests and audit
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_codex_github.py --root . --fail-on error

      - name: Commit patched runtime and refreshed source archive
        env:
          TARGET_BRANCH: task/mission-control-direct-pm-attractor-independence-20260901
        run: |
          git config user.name "mission-control-archive-refresh"
          git config user.email "mission-control-archive-refresh@users.noreply.github.com"
          git add \
            tools/codex-mission-control/restored/codex-mission-control/lib/ingestion-auth.ts \
            tools/codex-mission-control/restored/codex-mission-control/lib/store.ts \
            tools/codex-mission-control/restored/codex-mission-control/tests/worker-channel.test.ts \
            tools/codex-mission-control/source-archive \
            tools/codex-mission-control/SOURCE-ARCHIVE.sha256
          if git diff --cached --quiet; then
            echo "Runtime hotfix and source archive are already current"
            exit 0
          fi
          git commit -m "fix(mission-control): reject worker-authored proposals at ingestion"
          git push origin "HEAD:${TARGET_BRANCH}"
