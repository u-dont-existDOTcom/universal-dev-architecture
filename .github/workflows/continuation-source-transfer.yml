name: Exact continuation policy transfer
on:
  push:
    branches: [chat/continuation-stop-admission-20260918-1931]
    paths: [.github/workflows/continuation-source-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: contains(github.event.head_commit.message, 'Transfer exact locally verified continuation policy candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify and install exact policy diff on isolated writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 59a5799f3c964f39d326b1f922fc5863fbe8d806
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = ['e01c97a24593d4a60b6509aae8f3a5a867c618d8', '2558e6d857036105428ea161cc4ad99d08ab295c']
          body = b''
          for sha in parts:
              req = urllib.request.Request('https://api.github.com/repos/u-dont-existDOTcom/universal-dev-architecture/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              item = json.load(urllib.request.urlopen(req, timeout=20))
              part = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest() == sha
              body += part
          assert hashlib.sha256(body).hexdigest() == '825a2538d7a89c412e6174356143a2c5e91eb1cd1254a13f1368e30ab3f19a46'
          pathlib.Path('/tmp/continuation.patch').write_bytes(lzma.decompress(body))
          PY
          git apply --index /tmp/continuation.patch
          git rm .github/workflows/continuation-source-transfer.yml
          test "$(git write-tree)" = 035be904b3190ee4bcedced225ba1efa5e9ccf3f
          test "$(git ls-remote origin refs/heads/chat/continuation-stop-admission-20260918-1931 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'Harden continuation stop admission at scope and final-output boundaries'
          git push origin HEAD:refs/heads/chat/continuation-stop-admission-20260918-1931
