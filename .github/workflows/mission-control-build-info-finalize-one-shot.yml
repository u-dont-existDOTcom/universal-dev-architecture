name: One-shot Mission Control build identity finalization

on:
  push:
    branches:
      - task/mission-control-direct-pm-attractor-independence-20260901
    paths:
      - .github/workflows/mission-control-build-info-finalize-one-shot.yml

permissions:
  contents: read

concurrency:
  group: mission-control-build-info-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package-and-close:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/mission-control-direct-pm-attractor-independence-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Capture tested source head
        run: echo "TESTED_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh deterministic source archive
        run: bash tools/codex-mission-control/package-source.sh

      - name: Install locked dependencies
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm ci --ignore-scripts

      - name: Run focused authority and build identity tests
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npx tsx --test tests/chat-work-authority-gate.test.ts tests/build-info-route.test.ts

      - name: Run full Mission Control tests
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm test

      - name: Typecheck and build
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: |
          npm run typecheck
          npm run build

      - name: Run universal tests and repository audit
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_codex_github.py --root . --fail-on error

      - name: Verify archive contains exact new files
        run: |
          rm -rf /tmp/mission-control-build-info-archive
          mkdir -p /tmp/mission-control-build-info-archive
          cat tools/codex-mission-control/source-archive/codex-mission-control.zip.part-* > /tmp/codex-mission-control.zip
          unzip -q /tmp/codex-mission-control.zip -d /tmp/mission-control-build-info-archive
          for file in \
            lib/chat-work-authority-gate.ts \
            app/api/build-info/route.ts \
            tests/build-info-route.test.ts; do
            cmp \
              "tools/codex-mission-control/restored/codex-mission-control/$file" \
              "/tmp/mission-control-build-info-archive/codex-mission-control/$file"
          done

      - name: Write release-candidate receipt
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          archive_sha = Path('tools/codex-mission-control/SOURCE-ARCHIVE.sha256').read_text(encoding='utf-8').split()[0]
          receipt = {
              'schemaVersion': 1,
              'receiptType': 'mission_control_deploy_identity_release_candidate',
              'testedSourceHead': os.environ['TESTED_SOURCE_HEAD'],
              'branch': 'task/mission-control-direct-pm-attractor-independence-20260901',
              'sourceArchiveSha256': archive_sha,
              'focusedAuthorityAndBuildInfoTests': 'PASS',
              'fullMissionControlTests': 'PASS',
              'typecheck': 'PASS',
              'productionBuild': 'PASS',
              'universalTests': 'PASS',
              'repositoryAudit': 'PASS',
              'archiveParity': 'PASS',
              'publicBuildInfoEndpoint': '/api/build-info',
              'authorityGateVersion': 'chat-work-authority-v1',
              'deploymentStatus': 'NOT_YET_VERIFIED_BY_THIS_RECEIPT',
              'providerChatTransportStatus': 'NOT_PROVEN_BY_BUILD_IDENTITY',
          }
          Path('docs/audits/2026-09-01-mission-control-deploy-identity-release-candidate.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit archive and self-remove workflow
        env:
          TARGET_BRANCH: task/mission-control-direct-pm-attractor-independence-20260901
        run: |
          git config user.name "mission-control-build-finalizer"
          git config user.email "mission-control-build-finalizer@users.noreply.github.com"
          git rm .github/workflows/mission-control-build-info-finalize-one-shot.yml
          git add \
            tools/codex-mission-control/source-archive \
            tools/codex-mission-control/SOURCE-ARCHIVE.sha256 \
            docs/audits/2026-09-01-mission-control-deploy-identity-release-candidate.json
          git commit -m "build(mission-control): package deploy identity release candidate"
          git push origin "HEAD:${TARGET_BRANCH}"
