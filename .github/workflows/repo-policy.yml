name: Repository policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: universal-repo-policy
  cancel-in-progress: true
jobs:
  repo-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: test -f AGENTS.md && test -f CURRENT-STATE.md && test -f docs/INDEX.md && test -f patterns/codex-github-operating-standard.md && test -f .codex/repository-policy.json
      - run: test "$(wc -c < AGENTS.md)" -le 32768
      - run: python3 -m json.tool .codex/repository-policy.json >/dev/null
