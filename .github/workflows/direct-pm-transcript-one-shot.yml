name: One-shot direct PM transcript bootstrap

# Attempt 3: write permission is scoped to the one mutation job.
on:
  push:
    branches:
      - task/mission-control-direct-pm-attractor-independence-20260901
    paths:
      - .github/workflows/direct-pm-transcript-one-shot.yml

permissions:
  contents: read

concurrency:
  group: direct-pm-transcript-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/mission-control-direct-pm-attractor-independence-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed transcript patch
        run: python3 scripts/apply_direct_pm_transcript_slice.py

      - name: Refresh deterministic Mission Control source archive
        run: bash tools/codex-mission-control/package-source.sh

      - name: Install locked Mission Control dependencies
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm ci --ignore-scripts

      - name: Run Mission Control tests
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm test

      - name: Check Mission Control TypeScript
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run typecheck

      - name: Build Mission Control production bundle
        working-directory: tools/codex-mission-control/restored/codex-mission-control
        run: npm run build

      - name: Run repository tests and audit
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_codex_github.py --root . --fail-on error

      - name: Commit exact verified result to the task branch
        env:
          TARGET_BRANCH: task/mission-control-direct-pm-attractor-independence-20260901
        run: |
          git config user.name "mission-control-one-shot"
          git config user.email "mission-control-one-shot@users.noreply.github.com"
          git add tools/codex-mission-control scripts/apply_direct_pm_transcript_slice.py
          if git diff --cached --quiet; then
            echo "No generated change was produced" >&2
            exit 1
          fi
          git commit -m "feat(mission-control): add source-bound PM transcript records"
          git push origin "HEAD:${TARGET_BRANCH}"
