name: Repository workflow policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enforce workflow security baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          workflow_dir = Path(".github/workflows")
          errors: list[tuple[Path, str]] = []
          uses_value_pattern = re.compile(
              r"""(?mx)
              (?:^[ \t]*-?[ \t]*|[\[\{,][ \t]*)
              (?:[\"']uses[\"']|uses)[ \t]*:[ \t]*
              (?:
                  "(?P<double>(?:\\.|[^"])*)"
                | '(?P<single>[^']*)'
                | (?P<plain>[^,\]\}\s#]+)
              )
              """
          )
          full_sha = re.compile(r"^[0-9a-fA-F]{40}$")
          block_scalar = re.compile(
              r":\s*[>|](?:(?:[+-][1-9]?)|(?:[1-9][+-]?))?\s*(?:#.*)?$"
          )
          on_trigger_line = re.compile(
              r"^(?P<indent>[ \t]*)(?P<quote>[\"']?)on(?P=quote)[ \t]*:[ \t]*(?P<value>[^\r\n]*)$"
          )

          def workflow_structure(text: str) -> str:
              structural: list[str] = []
              block_indent: int | None = None
              for line in text.splitlines():
                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip(" "))
                  if block_indent is not None:
                      if not stripped or indent > block_indent:
                          structural.append("")
                          continue
                      block_indent = None
                  structural.append(line)
                  if block_scalar.search(line):
                      block_indent = indent
              return "\n".join(structural)

          def yaml_code(line: str) -> str:
              if line.lstrip().startswith("#"):
                  return ""
              return line.split("#", 1)[0].rstrip()

          def yaml_indent(line: str) -> int:
              return len(line) - len(line.lstrip(" \t"))

          def flow_balance(value: str) -> int:
              balance = 0
              quote: str | None = None
              escaped = False
              for character in value:
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == quote:
                          quote = None
                      continue
                  if character in {'"', "'"}:
                      quote = character
                  elif character in "[{":
                      balance += 1
                  elif character in "]}":
                      balance -= 1
              return balance

          def normalized_scalar(value: str) -> str | None:
              scalar = value.strip()
              if "\\" in scalar:
                  return None
              if (
                  len(scalar) >= 2
                  and scalar[0] == scalar[-1]
                  and scalar[0] in {'"', "'"}
              ):
                  return scalar[1:-1]
              return scalar

          def flow_parts(value: str) -> list[str] | None:
              if len(value) < 2 or value[0] not in "[{" or value[-1] not in "]}":
                  return None
              parts: list[str] = []
              depth = 0
              quote: str | None = None
              escaped = False
              start = 1
              for index, character in enumerate(value[1:-1], start=1):
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == quote:
                          quote = None
                      continue
                  if character in {'"', "'"}:
                      quote = character
                  elif character in "[{":
                      depth += 1
                  elif character in "]}":
                      depth -= 1
                      if depth < 0:
                          return None
                  elif character == "," and depth == 0:
                      parts.append(value[start:index].strip())
                      start = index + 1
              if quote is not None or depth != 0:
                  return None
              final = value[start:-1].strip()
              if final:
                  parts.append(final)
              return parts

          def top_level_colon(value: str) -> int | None:
              depth = 0
              quote: str | None = None
              escaped = False
              for index, character in enumerate(value):
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == quote:
                          quote = None
                      continue
                  if character in {'"', "'"}:
                      quote = character
                  elif character in "[{":
                      depth += 1
                  elif character in "]}":
                      depth -= 1
                  elif character == ":" and depth == 0:
                      return index
              return None

          def flow_uses_pull_request_target(value: str) -> bool | None:
              parts = flow_parts(value)
              if parts is None:
                  return None
              if value.startswith("["):
                  for part in parts:
                      event = normalized_scalar(part)
                      if event is None or event.startswith(
                          ("*", "!", "&", "|", ">", "?", ":")
                      ):
                          return None
                      if event == "pull_request_target":
                          return True
                  return False

              for part in parts:
                  colon = top_level_colon(part)
                  if colon is None:
                      return None
                  event = normalized_scalar(part[:colon])
                  if event is None or event.startswith(
                      ("*", "!", "&", "|", ">", "?", ":")
                  ):
                      return None
                  if event == "pull_request_target":
                      return True
              return False

          def uses_values(structure: str) -> list[str]:
              values: list[str] = []
              for match in uses_value_pattern.finditer(structure):
                  value = match.group("double")
                  if value is None:
                      value = match.group("single")
                  if value is None:
                      value = match.group("plain")
                  values.append(value)
              return values

          def uses_value_is_unresolved(value: str) -> bool:
              return "\\" in value or value.startswith(
                  ("*", "&", "!", "|", ">", "?", ":", "$")
              )

          def uses_value_may_be_checkout(value: str) -> bool:
              if value.startswith("./") or value.startswith("docker://"):
                  return False
              if uses_value_is_unresolved(value):
                  return True
              action, separator, _ref = value.rpartition("@")
              if not separator:
                  return True
              return action == "actions/checkout"

          def uses_pull_request_target(structure: str) -> bool:
              lines = structure.splitlines()
              root_indents = [
                  yaml_indent(code)
                  for line in lines
                  if (code := yaml_code(line)).strip()
                  and code.strip() not in {"---", "..."}
              ]
              if not root_indents:
                  return True
              root_indent = min(root_indents)
              saw_trigger_node = False

              for index, line in enumerate(lines):
                  code = yaml_code(line)
                  match = on_trigger_line.match(code)
                  if match is None or yaml_indent(code) != root_indent:
                      continue
                  saw_trigger_node = True
                  base_indent = yaml_indent(code)
                  value = match.group("value").strip()
                  while value.startswith(("&", "!")):
                      node_property = value.split(None, 1)
                      value = node_property[1].lstrip() if len(node_property) == 2 else ""
                  if value.startswith(("*", "|", ">")):
                      return True
                  if value:
                      if value.startswith(("[", "{")):
                          balance = flow_balance(value)
                          flow = value
                          for continuation in lines[index + 1:]:
                              if balance <= 0:
                                  break
                              continuation_code = yaml_code(continuation)
                              flow += "\n" + continuation_code
                              balance += flow_balance(continuation_code)
                          if balance != 0:
                              return True
                          result = flow_uses_pull_request_target(flow)
                          if result is None or result:
                              return True
                          continue
                      event = normalized_scalar(value)
                      if event is None:
                          return True
                      if event == "pull_request_target":
                          return True
                      continue

                  direct_child_indent: int | None = None
                  sequence_indent: int | None = None
                  children = lines[index + 1:]
                  for child_index, child in enumerate(children):
                      child_code = yaml_code(child)
                      if not child_code.strip():
                          continue
                      indent = yaml_indent(child_code)
                      stripped = child_code.strip()
                      if direct_child_indent is None and sequence_indent is None:
                          if stripped.startswith("-") and indent >= base_indent:
                              sequence_indent = indent
                          elif indent > base_indent:
                              direct_child_indent = indent
                          else:
                              break

                      if sequence_indent is not None:
                          if indent < sequence_indent:
                              break
                          if indent != sequence_indent:
                              continue
                          if not stripped.startswith("-"):
                              break
                          event = stripped[1:].strip()
                          if not event:
                              for nested in children[child_index + 1:]:
                                  nested_code = yaml_code(nested)
                                  if not nested_code.strip():
                                      continue
                                  if yaml_indent(nested_code) <= sequence_indent:
                                      break
                                  event = nested_code.strip()
                                  break
                          if "\\" in event or "*" in event or event.startswith(
                              ("?", ":", "!", "&", "|", ">")
                          ):
                              return True
                          event = event.split(":", 1)[0].strip().strip("\"'")
                          if event == "pull_request_target":
                              return True
                          continue

                      if indent <= base_indent:
                          break
                      if indent != direct_child_indent:
                          continue
                      event = stripped
                      if "\\" in event or "*" in event or event.startswith(
                          ("?", ":", "!", "&", "|", ">")
                      ):
                          return True
                      event = event.split(":", 1)[0].strip().strip("\"'")
                      if event == "pull_request_target":
                          return True
              return not saw_trigger_node

          for path in sorted(workflow_dir.glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              structure = workflow_structure(text)
              code_structure = "\n".join(
                  yaml_code(line) for line in structure.splitlines()
              )
              action_values = uses_values(code_structure)

              if not re.search(r"(?m)^permissions\s*:", structure):
                  errors.append(
                      (path, "missing explicit top-level permissions")
                  )

              if re.search(
                  r"(?m)^\s*permissions\s*:\s*write-all\s*(?:#.*)?$", structure
              ):
                  errors.append((path, "permissions: write-all is forbidden"))

              if uses_pull_request_target(structure) and any(
                  uses_value_may_be_checkout(value) for value in action_values
              ):
                  errors.append(
                      (
                          path,
                          "pull_request_target must not check out or execute untrusted pull-request code",
                      )
                  )

              for value in action_values:
                  if value.startswith("./") or value.startswith("docker://"):
                      continue
                  if uses_value_is_unresolved(value):
                      errors.append(
                          (
                              path,
                              f"action reference {value} cannot be resolved statically",
                          )
                      )
                      continue
                  action, separator, ref = value.rpartition("@")
                  if not separator:
                      errors.append(
                          (
                              path,
                              f"action reference {value} has no statically verifiable ref",
                          )
                      )
                      continue
                  if not full_sha.fullmatch(ref):
                      errors.append(
                          (
                              path,
                              f"remote dependency {action}@{ref} is not pinned to a full commit SHA",
                          )
                      )

          for path, message in errors:
              print(f"::error file={path}::{message}")

          if errors:
              print(f"workflow policy failed with {len(errors)} finding(s)")
              sys.exit(1)

          print("workflow policy passed")
          PY
